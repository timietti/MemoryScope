# docker-compose.yml  —  MemoryScope stack
# Run: docker compose up -d
#
# Three-tier network model:
#   internal  — container-to-container only; no host ports, no internet egress
#   external  — bridge network for host port publishing and outbound internet
#
# Workers are on both networks: internal for DB/Redis/MinIO, external for
# outbound AI analysis calls (Anthropic API).
#
# Port binding tiers:
#   127.0.0.1:PORT:PORT  → host-only (dev access from localhost)
#   PORT:PORT            → network-visible (nginx HTTPS/HTTP only)
#
# Runtime secrets (Anthropic, VirusTotal, Volatility paths) are configured
# via Admin → Settings after first login; they are NOT set here.

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.worker
  environment:
    # Workers use the sync psycopg2 driver, not asyncpg
    - DATABASE_URL=postgresql://memoryscope:${DB_PASSWORD}@postgres:5432/memoryscope
    - REDIS_URL=redis://redis:6379/0
    - S3_ENDPOINT=http://minio:9000
    - S3_ACCESS_KEY=${S3_ACCESS_KEY}
    - S3_SECRET_KEY=${S3_SECRET_KEY}
    - SECRET_KEY=${SECRET_KEY}
    - VOLATILITY_PATH=/opt/volatility3/vol.py
    - SYMBOL_CACHE_PATH=/opt/volatility3/symbols
    - WORKER_TMP_DIR=/tmp/memoryscope
    - TMPDIR=/tmp/memoryscope
    - HOME=/tmp/memoryscope        # Volatility3 creates ~/.cache/volatility3 at import; needs writable dir
  volumes:
    - worker-symbols:/opt/volatility3/symbols       # shared symbol cache
  tmpfs:
    - /tmp/memoryscope:size=64g,mode=1777           # analysis working dir (in-memory)
  security_opt:
    - no-new-privileges:true
    - seccomp:infra/docker/seccomp-worker.json
  cap_drop:
    - ALL
  cap_add:
    - SYS_PTRACE   # needed by some Volatility3 operations
  read_only: true
  networks:
    - internal
    - external   # required for outbound AI analysis (Anthropic API)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — not reachable over the network
    environment:
      POSTGRES_DB: memoryscope
      POSTGRES_USER: memoryscope
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/alembic_stamp.sql:/docker-entrypoint-initdb.d/02-alembic-stamp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryscope"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - external

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"   # localhost only
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal
      - external

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — localhost only
      - "127.0.0.1:9001:9001"   # MinIO console — localhost only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal
      - external

  # ── API (FastAPI) ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://memoryscope:${DB_PASSWORD}@postgres:5432/memoryscope
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=["http://localhost:3000","https://${DOMAIN:-memoryscope.local}"]
      - ENV=${ENV:-development}
      - LOG_FILE=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - external   # outbound internet for Anthropic / VT APIs; infra services also on external

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    <<: *worker-base
    command: celery -A backend.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=analysis,plugins,default
      --max-tasks-per-child=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 16G

  # ── Celery Beat (scheduled tasks) ───────────────────────────────────────────
  beat:
    <<: *worker-base
    command: celery -A backend.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Flower (Celery monitoring) ───────────────────────────────────────────────
  # Minimal setup — flower only needs Redis and the app code to monitor tasks.
  flower:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    command: celery -A backend.workers.celery_app flower --port=5555
    environment:
      - DATABASE_URL=postgresql://memoryscope:${DB_PASSWORD}@postgres:5432/memoryscope
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "127.0.0.1:5555:5555"   # localhost only
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
      - external

  # ── Frontend (nginx serving built React SPA) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    networks:
      - external

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  # The only service with network-visible ports.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"     # network-visible — redirects to HTTPS
      - "443:443"   # network-visible — TLS termination
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - external   # proxies to api and frontend, both on external

volumes:
  postgres-data:
  redis-data:
  minio-data:
  worker-symbols:    # persistent symbol cache shared across worker replicas

networks:
  internal:
    internal: true   # no outbound internet, no host port publishing
  external:
    driver: bridge   # controlled host port publishing via 127.0.0.1 or 0.0.0.0
