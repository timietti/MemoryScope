# infra/nginx/nginx.conf
# Reverse proxy: routes /api → FastAPI, /ws → FastAPI WebSocket, / → React SPA
# Enforces TLS, file size limits, and security headers.

worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # ── Upload size limit: 70 GB (slightly above our app limit) ───────────────
    client_max_body_size 70g;
    client_body_timeout 3600s;    # 1 hour for large dump uploads
    proxy_read_timeout 3600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;

    # ── WebSocket upgrade map ──────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Gzip (for API responses, not binary uploads) ───────────────────────────
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1000;

    # ── Rate limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;   # 5 uploads/min
    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;  # 60 API calls/min

    # ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; worker-src 'self' blob:;" always;

            # Docker's embedded DNS — resolves upstream names at request time,
        # not at startup, so nginx starts cleanly even if api/frontend are still booting.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api      http://api:8000;
        set $upstream_frontend http://frontend:3000;

        # ── React SPA (static) ─────────────────────────────────────────────────
        location / {
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
        }

        # ── REST API ───────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
        }

        # ── Upload endpoint (stricter rate limit on POST only) ────────────────
        # Exact match so sub-paths (/cases/123, /cases/123/plugins) fall through
        # to /api/ and use the normal API rate zone.
        location = /api/v1/cases {
            limit_req zone=api burst=20 nodelay;   # GET case list uses normal limit
            limit_except GET HEAD OPTIONS {
                limit_req zone=upload burst=3 nodelay;  # POST (file upload) is strict
            }
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_request_buffering off;
        }

        # ── WebSocket ──────────────────────────────────────────────────────────
        location /ws/ {
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ── Health check (no auth needed) ──────────────────────────────────────
        location /health {
            proxy_pass $upstream_api/health;
            access_log off;
        }
    }
}
