server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly; fall back to index.html for all other routes
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access log for health/readiness probes
    location = /index.html {
        access_log off;
        add_header Cache-Control "no-store";
    }
}
